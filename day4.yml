apiVersion: v1  # NodePort is a service type that exposes the service on each Node’s IP at a static port (NodePort)
kind: Service
metadata:
  name: flask-app-service
spec:
  type: NodePort
  selector:
    app: frontendapp # Select the pods with the label app.kubernetes.io/name: frontendapp
  ports:
    - port: 80
      targetPort: 8000 # Port in which the container is listening
      # Optional field
      # By default and for convenience, the Kubernetes control plane
      # will allocate a port from a range (default: 30000-32767)
      nodePort: 30008