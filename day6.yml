apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-routing-ingress
  labels:
    app: routing-types
    type: basic-routing
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80