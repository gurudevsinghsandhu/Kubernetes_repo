apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildcard-ingress-example
spec:
  rules:
  - host: "*.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
